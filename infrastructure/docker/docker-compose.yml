services:
  db:
    image: postgres:16-alpine
    container_name: worksync-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: worksync-platform_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: worksync-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
